<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendizaje IA | Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Login</h1>
            <form th:action="@{/paginaPrincipal}" method="get">
                <div class="login-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="login-field">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember Me</label>
                </div>

                <button type="submit" class="btn-dark btn-full">Login</button>
            </form>

            <a href="#" class="forgot-link">Olvido su contraseña</a>

            <div class="divider"><span>OR</span></div>

            <p class="social-text">Sign In using your account with</p>
            <a th:href="@{/paginaPrincipal}" class="btn-google">
                <span style="color: #4285F4; font-weight: 800; font-size: 1.1rem;">G</span>
                <span>Google</span>
            </a>
        </div>
    </div>
</body>
</html>
